name: Сode-push CI

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  Run-tests:
    name: Test code-push-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Setup dependencies
        run: npm run setup
      - name: Build
        run: npm run build:release
#      - name: Run tests
#        run: npm run test
      - name: Publish
        run: |
          cd bin
          npm publish --access public --tag ${{github.ref_name == 'master' && 'latest' || 'next' }}
